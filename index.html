<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Rola</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Tu reproductor de música conectado a Spotify, con tu propio diseño.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Figtree:wght@400;500;600;700&family=Gloock&family=Shrikhand&display=swap">
<style>
/* Layout: phone = header, scrolling view, mini-player and tab bar fixed at the bottom, now-playing slides up as a sheet.
   Desktop = sidebar | view | always-open now-playing column. Every color comes from the palette the person picks. */
:root{
  --paper:#ECEFF5; --surface:#FFFFFF; --ink:#1B2550; --muted:#5B6488; --line:#D3D8E6; --accent:#E0306F; --on-accent:#FFFFFF;
  --f-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",sans-serif;
  --w-display:800; --ls-display:-0.005em; --lh-display:.9; --display-scale:1;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-cover:6px; --tabs-h:60px; --mini-h:64px; --gut:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#0E1226;--surface:#171C36;--ink:#E9ECF8;--muted:#9AA2C6;--line:#2A3157;--accent:#FF5C97;--on-accent:#170A12;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0E1226;--surface:#171C36;--ink:#E9ECF8;--muted:#9AA2C6;--line:#2A3157;--accent:#FF5C97;--on-accent:#170A12;color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:35;background:var(--paper)}
body.np-open{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:not-allowed;opacity:.45}
a{color:inherit}
img{display:block;max-width:100%}
h1,h2,h3,p,ol,ul{margin:0}
ol,ul{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{flex:none;display:block}
.muted{color:var(--muted)}
[hidden]{display:none!important}

/* ---------- display type ---------- */
.display{font-family:var(--f-display);font-weight:var(--w-display);letter-spacing:var(--ls-display);line-height:var(--lh-display);text-wrap:balance}
.brand{font-size:calc(2.1rem * var(--display-scale));line-height:1}
.view-h{font-size:calc(2.9rem * var(--display-scale));margin:10px 0 6px}

/* ---------- shell ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px));background:var(--paper)}
.top-actions{display:flex;gap:4px;align-items:center}
.side{display:none}
main{padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px));padding-block:2px calc(var(--tabs-h) + var(--mini-h) + 32px + env(safe-area-inset-bottom,0px));min-width:0}
.banner{padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px));padding-block:2px 6px}
.banner-in{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap;background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 10px 10px 14px;font-size:14px;font-weight:500}
.banner-in p{flex:1 1 180px}
.banner-in.warn{background:var(--accent);color:var(--on-accent)}

.icon-btn{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;flex:none}
.icon-btn:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.avatar{width:30px;height:30px;border-radius:50%;object-fit:cover}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:26;display:grid;grid-template-columns:repeat(3,1fr);background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{height:var(--tabs-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.tab[aria-current="page"]{color:var(--ink)}

.mini{position:fixed;left:0;right:0;bottom:calc(var(--tabs-h) + env(safe-area-inset-bottom,0px));z-index:25;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:8px}
.mini-in{display:flex;align-items:center;gap:6px;height:var(--mini-h);padding:0 6px 0 8px;background:var(--surface);border-radius:14px;box-shadow:0 8px 28px -8px color-mix(in srgb,var(--ink) 35%,transparent);position:relative;overflow:hidden}
.mini-open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;height:100%}
.mini-open img,.mini-open .ph{width:46px;height:46px;border-radius:5px;object-fit:cover;flex:none}
.mini-text{min-width:0;display:flex;flex-direction:column}
.mini-bar{position:absolute;left:10px;right:10px;bottom:0;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.mini-bar i{display:block;height:100%;width:var(--pct,0%);background:var(--accent)}
.ph{display:block;background:color-mix(in srgb,var(--ink) 12%,var(--paper))}

/* ---------- lists ---------- */
.sec-h{font-size:1.15rem;font-weight:700;letter-spacing:-.01em;margin:30px 0 12px}
.tracks{display:flex;flex-direction:column}
.trow{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;padding:7px 8px;margin-inline:-8px;width:calc(100% + 16px);border-radius:10px;text-align:left}
.trow:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.trow img,.trow .ph{width:46px;height:46px;border-radius:5px;object-fit:cover}
.trow.num{grid-template-columns:28px minmax(0,1fr) auto}
.trow .n{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;font-size:14px}
.t-meta{min-width:0;display:flex;flex-direction:column}
.t-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.t-name span{overflow:hidden;text-overflow:ellipsis}
.t-sub{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-dur{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.trow.is-current .t-name{color:var(--accent)}
.eq{display:none;gap:2px;align-items:flex-end;height:12px;flex:none}
.trow.is-current .eq{display:inline-flex}
.eq i{display:block;width:3px;height:60%;background:currentColor;border-radius:1px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.45s}
.eq i:nth-child(3){animation-delay:-.75s}
body:not(.is-playing) .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{height:28%}50%{height:100%}}

.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:138px;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:var(--gut);margin-inline:calc(var(--gut) * -1);padding-inline:var(--gut);padding-bottom:6px;scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.card{scroll-snap-align:start;display:flex;flex-direction:column;gap:8px;min-width:0;text-align:left}
.card img,.card .ph{width:100%;aspect-ratio:1;border-radius:var(--r-cover);object-fit:cover}
.card .c-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .c-sub{color:var(--muted);font-size:13px;margin-top:-6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.round img,.card.round .ph{border-radius:50%}
.card.round{text-align:center}
.card.is-current .c-name{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:20px 14px}

.prow{display:grid;grid-template-columns:58px minmax(0,1fr);gap:14px;align-items:center;padding:8px;margin-inline:-8px;width:calc(100% + 16px);border-radius:10px;text-align:left}
.prow:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.prow img,.prow .ph{width:58px;height:58px;border-radius:6px;object-fit:cover}

.empty{padding:28px 0;display:flex;flex-direction:column;gap:14px;align-items:flex-start;max-width:46ch}
.empty p{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);font-weight:600;font-size:14px}
.chip:hover{border-color:var(--ink)}
.skel{border-radius:8px;background:color-mix(in srgb,var(--ink) 8%,transparent)}

/* ---------- controls ---------- */
.btn-accent{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--on-accent);font-weight:700;border-radius:999px;padding:12px 22px;white-space:nowrap}
.btn-accent:hover{filter:brightness(1.06)}
.btn-line{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);font-weight:600;border-radius:999px;padding:10.5px 18px;white-space:nowrap}
.btn-line:hover{border-color:var(--ink)}
.sm{padding:8px 14px;font-size:14px}
.wide{width:100%}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:color-mix(in srgb,var(--ink) 7%,transparent);max-width:100%;overflow-x:auto}
.seg button{padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.seg [aria-selected="true"],.seg [aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px color-mix(in srgb,var(--ink) 16%,transparent)}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:0 14px;height:52px;margin:14px 0 6px;color:var(--muted)}
.search:focus-within{border-color:var(--ink)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px;color:var(--ink)}
.search input::-webkit-search-cancel-button{display:none}
.back{display:inline-flex;align-items:center;gap:2px;font-weight:600;color:var(--muted);padding:8px 10px 8px 2px;margin:4px 0 0 -4px;border-radius:8px}
.back:hover{color:var(--ink)}
.link{text-decoration:underline;text-decoration-color:color-mix(in srgb,currentColor 35%,transparent);text-underline-offset:3px}
.link:hover{text-decoration-color:currentColor}

.range{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer;--pct:0%;margin:0}
.range:disabled{cursor:not-allowed;opacity:.5}
.range::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--ink) var(--pct),var(--line) var(--pct))}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--ink);margin-top:-5px;border:0}
.range::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
.range::-moz-range-progress{height:4px;border-radius:2px;background:var(--ink)}
.range::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--ink)}

/* ---------- detail ---------- */
.dhead{display:flex;flex-direction:column;gap:18px;margin:8px 0 20px}
.dcover{width:min(240px,62vw);aspect-ratio:1;border-radius:var(--r-cover);overflow:hidden;box-shadow:0 18px 40px -16px color-mix(in srgb,var(--ink) 50%,transparent);flex:none}
.dcover img,.dcover .ph{width:100%;height:100%;object-fit:cover}
.dcover.round{border-radius:50%}
.dmeta{min-width:0;display:flex;flex-direction:column;gap:8px}
.dtitle{font-size:calc(clamp(2.5rem,9vw,4.2rem) * var(--display-scale));overflow-wrap:anywhere}
.dsub{color:var(--muted);font-weight:500}
.dactions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.note{background:color-mix(in srgb,var(--accent) 12%,var(--surface));border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.5}

/* ---------- now playing ---------- */
.np{position:fixed;inset:0;z-index:40;background:var(--paper);overflow-y:auto;overscroll-behavior:contain;transform:translateY(100%);visibility:hidden;transition:transform .34s cubic-bezier(.2,.8,.2,1),visibility 0s linear .34s;padding-top:calc(env(safe-area-inset-top,0px) + 6px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px);padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.np.open{transform:none;visibility:visible;transition:transform .34s cubic-bezier(.2,.8,.2,1),visibility 0s}
.np-in{max-width:500px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.np-top{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px}
.np-dev{display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:600;color:var(--muted);padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);max-width:78%}
.np-dev span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-dev:hover{border-color:var(--ink);color:var(--ink)}
.np-dev.live{color:var(--ink)}
.np-cover{width:100%;max-width:420px;aspect-ratio:1;margin:4px auto 0;border-radius:var(--r-cover);overflow:hidden;background:var(--line);box-shadow:0 24px 50px -22px color-mix(in srgb,var(--ink) 55%,transparent);position:relative}
.np-cover img,.np-cover .ph{width:100%;height:100%;object-fit:cover}
[data-cover="disc"] .np-cover{border-radius:50%;animation:spin 14s linear infinite;animation-play-state:paused}
[data-cover="disc"] .np-cover.spinning{animation-play-state:running}
[data-cover="disc"] .np-cover::after{content:"";position:absolute;inset:42%;border-radius:50%;background:var(--paper);box-shadow:0 0 0 7px color-mix(in srgb,var(--ink) 22%,transparent)}
[data-cover="disc"] .mini-open img,[data-cover="disc"] .mini-open .ph{border-radius:50%}
@keyframes spin{to{transform:rotate(1turn)}}
.np-text{display:flex;flex-direction:column;gap:10px;min-width:0}
.np-title{font-size:calc(clamp(2.6rem,11vw,3.8rem) * var(--display-scale));overflow-wrap:anywhere}
.riso .np-title{text-shadow:.05em .045em 0 color-mix(in srgb,var(--accent) 72%,transparent)}
.np-artist{font-size:1.05rem;font-weight:600;color:var(--muted)}
.np-artist button{color:inherit}
.np-artist button:hover{color:var(--ink)}
.np-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.np-open{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--muted);text-decoration:none;padding:8px 4px}
.np-open:hover{color:var(--ink)}
.times{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.np-ctrls{display:grid;grid-template-columns:repeat(5,1fr);align-items:center;justify-items:center}
.ctl{width:50px;height:50px;display:grid;place-items:center;border-radius:50%;color:var(--ink);position:relative}
.ctl:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.ctl.side-ctl{color:var(--muted)}
.ctl.on{color:var(--accent)}
.ctl.on::after{content:"";position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:currentColor}
.ctl .one{position:absolute;top:11px;right:9px;font-size:9px;font-weight:800;line-height:1}
.ctl-play{width:76px;height:76px;background:var(--accent);color:var(--on-accent)}
.ctl-play:hover{background:var(--accent);filter:brightness(1.06)}
.np-vol{display:flex;align-items:center;gap:12px;color:var(--muted)}
.np-queue h3{font-size:1rem;font-weight:700;margin:10px 0 8px}
.np-queue .trow{cursor:default}
.np-queue .trow:hover{background:none}

/* ---------- sheet ---------- */
.sheet-bg{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,#000 45%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:90vh;max-height:90dvh;overflow-y:auto;overscroll-behavior:contain;border-radius:20px 20px 0 0;padding-top:18px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-bottom:calc(26px + env(safe-area-inset-bottom,0px))}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sh-head h2{font-size:calc(2.2rem * var(--display-scale))}
.sh-lead{color:var(--muted);margin-top:6px}
.field{display:flex;flex-direction:column;gap:10px;margin:22px 0 0;border:0;padding:0;min-width:0}
.field>label,.field>legend,.lbl{font-weight:700;font-size:14px;padding:0}
.txt{height:48px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);padding:0 12px;font-size:16px;width:100%;min-width:0}
.txt:focus{outline:none;border-color:var(--ink)}
.swatches{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.swatch{display:flex;flex-direction:column;gap:6px;font-size:12px;min-width:0;overflow-wrap:anywhere;font-weight:600;padding:6px;border-radius:12px;border:2px solid transparent;text-align:left}
.swatch[aria-pressed="true"]{border-color:var(--ink)}
.sw-chip{width:100%;aspect-ratio:1.5;border-radius:8px;background:linear-gradient(90deg,var(--a) 50%,var(--d) 50%);position:relative;border:1px solid var(--line);overflow:hidden}
.sw-chip::before,.sw-chip::after{content:"";position:absolute;width:34%;aspect-ratio:1;border-radius:50%;top:30%}
.sw-chip::before{background:var(--b);left:14%}
.sw-chip::after{background:var(--c);left:34%;opacity:.9}
.fonts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fontopt{border:2px solid var(--line);border-radius:12px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.fontopt .aa{font-size:2.1rem;line-height:1;color:var(--ink)}
.fontopt[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.accent-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pick{position:relative;display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;border:1.5px solid var(--line);font-weight:600;font-size:14px;cursor:pointer}
.pick[data-on="true"]{border-color:var(--ink)}
.pick input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.pick .dot{width:26px;height:26px;border-radius:50%;background:var(--sw);border:1px solid var(--line)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:14px;font-weight:600;font-size:15px;cursor:pointer;padding:4px 0}
.switch input{-webkit-appearance:none;appearance:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(18px)}
.sheet-foot{margin-top:26px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.steps{list-style:decimal;padding-left:1.25em;display:flex;flex-direction:column;gap:16px;margin:18px 0 22px}
.steps li::marker{font-weight:700}
.steps p{line-height:1.5}
.copy{display:flex;gap:8px;align-items:center;margin-top:8px;min-width:0}
.copy code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:13px}
.fine{color:var(--muted);font-size:13px;margin-top:14px;line-height:1.5}
.devs{display:flex;flex-direction:column;gap:6px;margin:18px 0 8px}
.dev{display:flex;align-items:center;gap:14px;padding:12px;border-radius:12px;border:1.5px solid var(--line);font-weight:600;text-align:left;width:100%}
.dev:hover{border-color:var(--ink)}
.dev.active{border-color:var(--accent);color:var(--accent)}
.dev .grow{flex:1;min-width:0}
.dev small{display:block;color:var(--muted);font-weight:500}
.acct{display:flex;align-items:center;gap:14px;margin:18px 0 6px}
.acct img,.acct .ph{width:56px;height:56px;border-radius:50%;object-fit:cover}

const PRESETS = {

const randStr = n => { const a = new Uint8Array(n); crypto.getRandomValues(a); const c = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'; return Array.from(a, x => c[x % c.length]).join(''); };

    const verifier = randStr(64), state = randStr(16);
    store.set('pkce', { verifier, state });
    const q = new URLSearchParams({ response_type: 'code', client_id: this.clientId, scope: SCOPES, code_challenge_method: 'S256', code_challenge: await challengeFor(verifier), redirect_uri: this.redirectUri(), state });
    location.href = 'https://accounts.spotify.com/authorize?' + q;
  },
  async handleCallback() {
    const q = new URLSearchParams(location.search);
    if (!q.has('code') && !q.has('error')) return false;
    history.replaceState(null, '', location.pathname + location.hash);
    if (q.get('error')) { toast(q.get('error') === 'access_denied' ? 'No se conectó porque se canceló el permiso en Spotify.' : 'Spotify respondió con un error: ' + q.get('error')); return false; }
    const pk = store.get('pkce'); store.del('pkce');
    if (!pk || pk.state !== q.get('state')) { toast('El inicio de sesión expiró. Toca Conectar Spotify otra vez.'); return false; }
    const r = await fetch(TOKEN_URL, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams({ grant_type: 'authorization_code', code: q.get('code'), redirect_uri: this.redirectUri(), client_id: this.clientId, code_verifier: pk.verifier }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { toast('No se completó la conexión (' + (j.error_description || j.error || r.status) + '). Revisa que la Redirect URI sea idéntica a la del panel de Spotify.'); return false; }
    this.save(j); return true;
  },
  save(j) { const prev = this.tokens() || {}; store.set('auth', { access: j.access_token, refresh: j.refresh_token || prev.refresh, expiresAt: Date.now() + (j.expires_in || 3600) * 1000 - 60000 }); },
  async refresh() {
    const t = this.tokens(); if (!t?.refresh) throw Object.assign(new Error('Sesión vencida'), { code: 'no_auth' });
    const r = await fetch(TOKEN_URL, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams({ grant_type: 'refresh_token', refresh_token: t.refresh, client_id: this.clientId }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error('Sesión vencida'), { code: 'no_auth' });
    this.save(j);
  },
  refreshOnce() { if (!this._rp) this._rp = this.refresh().finally(() => { this._rp = null; }); return this._rp; },
  async token() { let t = this.tokens(); if (!t) throw Object.assign(new Error('Sin sesión'), { code: 'no_auth' }); if (Date.now() > t.expiresAt) { await this.refreshOnce(); t = this.tokens(); } return t.access; },
  logout() { store.del('auth'); },
};

function sessionLost() {
  if (S.mode !== 'live') return;
  Auth.logout();
  toast('Tu sesión de Spotify venció. Vuelve a conectar desde tu cuenta.');
  startDemo(); render();
}

async function sp(path, opt = {}, retry = true) {
  const { method = 'GET', body, query } = opt;
  const url = new URL(API + path);
  if (query) Object.entries(query).forEach(([k, v]) => { if (v != null) url.searchParams.set(k, v); });
  let tok;
  try { tok = await Auth.token(); } catch (e) { sessionLost(); throw e; }
  const r = await fetch(url, { method, headers: { Authorization: 'Bearer ' + tok, ...(body ? { 'Content-Type': 'application/json' } : {}) }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401 && retry) { try { await Auth.refreshOnce(); } catch (e) { sessionLost(); throw e; } return sp(path, opt, false); }
  if (r.status === 204 || r.status === 202) return null;
  const text = await r.text(); let j = null; try { j = text ? JSON.parse(text) : null; } catch {}
  if (!r.ok) throw Object.assign(new Error(j?.error?.message || ('HTTP ' + r.status)), { status: r.status, reason: j?.error?.reason });
  return j;
}

function errMsg(e) {
  if (e?.reason === 'PREMIUM_REQUIRED') return 'Para controlar la música se necesita Spotify Premium.';
  if (e?.reason === 'NO_ACTIVE_DEVICE' || e?.status === 404) return 'No hay ningún dispositivo con Spotify abierto. Abre Spotify y vuelve a intentar.';
  if (e?.reason === 'VOLUME_CONTROL_DISALLOW') return 'Este dispositivo no deja cambiar el volumen desde otra app.';
  if (e?.status === 403) return 'Spotify no permitió esta acción. Si la cuenta no es la dueña de la app, agrégala en User Management del panel de Spotify.';
  if (e?.status === 429) return 'Spotify recibió demasiadas solicitudes. Espera un minuto y vuelve a intentar.';
  if (e instanceof TypeError) return 'No hay conexión con Spotify. Revisa tu internet.';
  return 'Spotify devolvió un error: ' + (e?.message || 'desconocido');
}

function svgCover(pat, bg, c1, c2) {
  let g = '';
  if (pat === 'circles') g = `<circle cx="188" cy="118" r="92" fill="${c1}"/><circle cx="112" cy="196" r="72" fill="${c2}" opacity=".88"/>`;
  else if (pat === 'stripes') { for (let i = -6; i < 12; i++) g += `<rect x="${i * 38}" y="-100" width="18" height="520" fill="${c1}" transform="rotate(28 150 150)"/>`; g += `<circle cx="150" cy="150" r="64" fill="${c2}"/>`; }
  else if (pat === 'grid') { for (let x = 0; x < 7; x++) for (let y = 0; y < 7; y++) { const r = 4 + ((x * 3 + y * 5) % 7) * 2.2; g += `<circle cx="${30 + x * 40}" cy="${30 + y * 40}" r="${r}" fill="${(x + y) % 3 ? c1 : c2}"/>`; } }
  else if (pat === 'sun') { g = `<rect y="190" width="300" height="110" fill="${c2}"/><circle cx="150" cy="190" r="86" fill="${c1}"/>`; for (let i = 0; i < 9; i++) g += `<rect x="0" y="${204 + i * 11}" width="300" height="4" fill="${bg}" opacity=".8"/>`; }
  else if (pat === 'waves') { for (let i = 0; i < 7; i++) { const y = 40 + i * 38; g += `<path d="M-10 ${y} Q 40 ${y - 26} 90 ${y} T 190 ${y} T 290 ${y} T 390 ${y}" stroke="${i % 2 ? c2 : c1}" stroke-width="14" fill="none"/>`; } }
  else if (pat === 'split') g = `<rect width="150" height="300" fill="${c1}"/><circle cx="150" cy="150" r="78" fill="${c2}"/>`;
  else if (pat === 'portrait') g = `<circle cx="150" cy="122" r="56" fill="${c2}"/><path d="M48 300c0-72 46-112 102-112s102 40 102 112z" fill="${c2}"/><circle cx="232" cy="64" r="26" fill="${c1}"/>`;
  else if (pat === 'blocks') g = `<rect x="30" y="30" width="110" height="110" fill="${c1}"/><rect x="160" y="30" width="110" height="110" fill="${c2}"/><rect x="30" y="160" width="110" height="110" fill="${c2}"/><circle cx="215" cy="215" r="55" fill="${c1}"/>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><rect width="300" height="300" fill="${bg}"/>${g}</svg>`);
}

const DP = { queue: [], index: -1 };
function demoLoad(list, i, play) {
  DP.queue = list.slice(); DP.index = i;
  const t = DP.queue[i];
  Object.assign(S.player, { item: t, isPlaying: play, progressMs: 0, durationMs: t.durationMs, updatedAt: Date.now() });
  if (!S.player.device) S.player.device = DEMO_DEVICES[0];
  onTrackChange();
}
function demoNext(auto) {
  if (!DP.queue.length) return;
  const P = S.player;
  if (auto && P.repeat === 'track') { Object.assign(P, { progressMs: 0, updatedAt: Date.now() }); return; }
  let i = DP.index + 1;
  if (P.shuffle && DP.queue.length > 1) { do { i = Math.floor(Math.random() * DP.queue.length); } while (i === DP.index); }
  if (i >= DP.queue.length) { if (auto && P.repeat === 'off') { Object.assign(P, { isPlaying: false, progressMs: P.durationMs, updatedAt: Date.now() }); return; } i = 0; }
  demoLoad(DP.queue, i, true);
}

async function fetchDevices() { try { S.devices = await D().devices(); } catch (e) { S.devices = []; } return S.devices; }

async function livePlay(body, optimistic) {
  const P = S.player;
  let deviceId = null;
  if (!P.device) {
    if (S.sdk.ready) { deviceId = S.sdk.deviceId; S.sdk.player?.activateElement?.(); }
    else {
      const d = await fetchDevices(); const pick = d.find(x => x.active) || d.find(x => !x.restricted);
      if (pick) deviceId = pick.id; else { openDevices(true); return; }
    }
  } else if (S.sdk.ready && P.device.id === S.sdk.deviceId) S.sdk.player?.activateElement?.();
  try { await sp('/me/player/play', { method: 'PUT', body, query: deviceId ? { device_id: deviceId } : null }); }
  catch (e) {
    if (e.status === 404) {
      const d = await fetchDevices(); const pick = d.find(x => !x.restricted);
      if (!pick) { openDevices(true); return; }
      try { await sp('/me/player/play', { method: 'PUT', body, query: { device_id: pick.id } }); } catch (e2) { toast(errMsg(e2)); return; }
    } else { toast(errMsg(e)); return; }
  }
  if (optimistic) Object.assign(P, { item: optimistic, isPlaying: true, progressMs: 0, durationMs: optimistic.durationMs, updatedAt: Date.now() });
  renderPlayer(true); syncSoon(800); syncSoon2();
}
function syncSoon2() { setTimeout(syncPlayer, 2200); }

  },
  async transfer(id) {
    if (S.mode === 'demo') { S.player.device = DEMO_DEVICES.find(d => d.id === id) || S.player.device; closeSheet(); renderPlayer(true); toast('Ahora suena en ' + S.player.device.name + '.'); return; }

function fromApiState(j) {
  const P = S.player;
  if (!j) { P.progressMs = currentMs(); P.isPlaying = false; P.device = null; P.updatedAt = Date.now(); return; }
  if (j.item) P.item = nTrack(j.item);
  P.isPlaying = !!j.is_playing; P.progressMs = j.progress_ms || 0; P.durationMs = j.item?.duration_ms || P.durationMs || 0; P.updatedAt = Date.now();
  P.shuffle = !!j.shuffle_state; P.repeat = j.repeat_state || 'off';
  P.device = j.device ? { id: j.device.id, name: j.device.name, type: j.device.type, volume: j.device.volume_percent, supportsVolume: j.device.supports_volume !== false } : null;
  if (P.device?.volume != null && !volDragging) P.volume = P.device.volume;
  P.contextUri = j.context?.uri || null;
}

let syncing = false, pollTimer = null, backoffUntil = 0;
async function syncPlayer() {
  if (S.mode !== 'live' || syncing || Date.now() < backoffUntil) return;
  syncing = true;
  try {
    const j = await sp('/me/player', { query: { additional_types: 'track,episode' } });
    const prev = S.player.item?.id;
    fromApiState(j);
    if (S.player.item?.id !== prev) onTrackChange();
    renderPlayer();
  } catch (e) { if (e.status === 429) backoffUntil = Date.now() + 30000; }
  finally { syncing = false; }
}
function syncSoon(ms = 700) { clearTimeout(syncSoon.t); syncSoon.t = setTimeout(syncPlayer, ms); }

async function onTrackChange() {
  const t = S.player.item;
  if (design.accentMode === 'cover') {
    if (!t) coverAccent = null;
    else if (t.album.color) coverAccent = t.album.color;
    else coverAccent = await extractColor(t.album.imageSm || t.album.image);
    applyDesign();
  }
  try { S.queue = await D().queue(); } catch { S.queue = []; }
  renderPlayer(true);
}

function extractColor(url) {
  return new Promise(res => {
    if (!url) return res(null);
    const im = new Image(); im.crossOrigin = 'anonymous';
    im.onload = () => {
      try {
        const c = document.createElement('canvas'); c.width = c.height = 32; const x = c.getContext('2d'); x.drawImage(im, 0, 0, 32, 32);
        const d = x.getImageData(0, 0, 32, 32).data; const bins = Array.from({ length: 12 }, () => ({ w: 0, r: 0, g: 0, b: 0 }));
        for (let i = 0; i < d.length; i += 4) {
          const r = d[i] / 255, g = d[i + 1] / 255, b = d[i + 2] / 255; const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, s = mx === mn ? 0 : (mx - mn) / (1 - Math.abs(2 * l - 1));
          if (s < .25 || l < .15 || l > .9) continue;
          let h = 0; if (mx === r) h = ((g - b) / (mx - mn)) % 6; else if (mx === g) h = (b - r) / (mx - mn) + 2; else h = (r - g) / (mx - mn) + 4; h = (h * 60 + 360) % 360;
          const bin = bins[Math.floor(h / 30)], w = s * s; bin.w += w; bin.r += d[i] * w; bin.g += d[i + 1] * w; bin.b += d[i + 2] * w;
        }
        const best = bins.reduce((a, b) => (b.w > a.w ? b : a));
        res(best.w > 0.5 ? rgbToHex(best.r / best.w, best.g / best.w, best.b / best.w) : null);
      } catch { res(null); }
    };
    im.onerror = () => res(null);
    im.src = url;
  });
}

/* ---------- Web Playback SDK (escritorio) ---------- */
function loadSDK() {
  if (isMobile || S.sdk.player || document.getElementById('spsdk')) return;
  window.onSpotifyWebPlaybackSDKReady = () => {
    const player = new window.Spotify.Player({ name: design.name || 'Rola', getOAuthToken: cb => { Auth.token().then(cb).catch(() => {}); }, volume: S.player.volume / 100 });
    player.addListener('ready', ({ device_id }) => { S.sdk.deviceId = device_id; S.sdk.ready = true; });
    player.addListener('not_ready', () => { S.sdk.ready = false; });
    player.addListener('player_state_changed', st => {
      if (!st || !S.sdk.deviceId) return;
      const ct = st.track_window?.current_track; const prev = S.player.item?.id; const P = S.player;
      if (ct) P.item = nTrack({ ...ct, type: ct.type === 'episode' ? 'episode' : 'track' });
      Object.assign(P, { isPlaying: !st.paused, progressMs: st.position, durationMs: st.duration, updatedAt: Date.now(), shuffle: st.shuffle, repeat: ['off', 'context', 'track'][st.repeat_mode] || 'off', device: { id: S.sdk.deviceId, name: (design.name || 'Rola') + ' en este navegador', type: 'Computer', supportsVolume: true } });
      if (P.item?.id !== prev) onTrackChange();
      renderPlayer();
    });
    ['initialization_error', 'authentication_error', 'account_error'].forEach(ev => player.addListener(ev, () => { S.sdk.failed = true; S.sdk.ready = false; }));
    S.sdk.player = player;
    setTimeout(() => { if (!S.sdk.ready) S.sdk.failed = true; }, 12000);
    player.connect().then(ok => { if (!ok) S.sdk.failed = true; }).catch(() => { S.sdk.failed = true; });
  };
  const s = document.createElement('script'); s.id = 'spsdk'; s.src = 'https://sdk.scdn.co/spotify-player.js'; s.async = true; s.onerror = () => { S.sdk.failed = true; };
  document.head.appendChild(s);
}

  miniEl.innerHTML = `<div class="mini-in">
    <button class="mini-open" data-action="np-open" aria-label="Abrir reproductor">${coverImg(t.album.imageSm || t.album.image)}<span class="mini-text"><span class="t-name"><span>${esc(t.name)}</span></span><span class="t-sub">${artistNames(t)}</span></span></button>
    <button class="icon-btn" data-action="toggle" aria-label="${P.isPlaying ? 'Pausar' : 'Reproducir'}">${icon(P.isPlaying ? 'pause' : 'play', 24)}</button>
    <span class="mini-bar"><i id="miniBar"></i></span></div>`;
}

function tick() {
  if (S.mode === 'demo' && S.player.isPlaying && S.player.item && currentMs() >= S.player.durationMs) { demoNext(true); renderPlayer(true); }
  const P = S.player, cur = currentMs(), pct = P.durationMs ? (cur / P.durationMs * 100) : 0;
  const seek = $('#seek');
  if (seek && !seekDragging) { seek.value = cur; seek.style.setProperty('--pct', pct + '%'); const tc = $('#tCur'); if (tc) tc.textContent = fmt(cur); }
  const mb = $('#miniBar'); if (mb) mb.style.setProperty('--pct', pct + '%');
}

/* ================= CHROME (cuenta, banner) ================= */
function renderChrome() {
  const banner = $('#banner');
  if (S.authError) { banner.hidden = false; banner.innerHTML = `<div class="banner-in warn"><p>${esc(S.authError)}</p><button class="btn-line sm" style="border-color:currentColor" data-action="account">Revisar conexión</button></div>`; }
  else if (S.mode === 'demo') { banner.hidden = false; banner.innerHTML = `<div class="banner-in"><p>Estás viendo música de ejemplo. Conecta tu cuenta para ver la tuya.</p><button class="btn-accent sm" data-action="open-connect">Conectar Spotify</button></div>`; }
  else banner.hidden = true;
  const topA = $('#topAccount'), sideA = $('#sideAccount');
  if (S.mode === 'live' && S.me) {
    topA.innerHTML = S.me.image ? `<img class="avatar" src="${esc(S.me.image)}" alt="">` : icon('user', 22);
    sideA.innerHTML = (S.me.image ? `<img class="avatar" src="${esc(S.me.image)}" alt="">` : icon('user', 22)) + `<span>${esc(S.me.name)}</span>`;
  } else {
    topA.innerHTML = icon('user', 22);
    sideA.innerHTML = icon('link', 22) + '<span>Conectar Spotify</span>';
  }
}

/* ================= HOJAS (modales) ================= */
const sheetBg = $('#sheetBg'), sheet = $('#sheet');
let sheetKind = null, lastFocus = null;
function openSheet(kind, html) {
  if (!sheetKind) lastFocus = document.activeElement;
  sheetKind = kind; sheet.innerHTML = html; sheet.setAttribute('aria-label', { design: 'Tu diseño', connect: 'Conectar Spotify', devices: 'Dónde suena', account: 'Tu cuenta' }[kind] || 'Panel');
  sheetBg.hidden = false;
  sheet.querySelector('button')?.focus({ preventScroll: true });
}
function closeSheet() { sheetBg.hidden = true; sheetKind = null; sheet.innerHTML = ''; lastFocus?.focus?.({ preventScroll: true }); }
const sheetHead = title => `<div class="sh-head"><h2 class="display">${title}</h2><button class="icon-btn" data-action="sheet-close" aria-label="Cerrar">${icon('x')}</button></div>`;

function designSheetHtml() {
  const pressed = (a, b) => `aria-pressed="${a === b}"`;
  return sheetHead('Tu diseño') + `<p class="sh-lead">Los cambios se ven al momento y se guardan en este navegador.</p>
  <div class="field"><label for="dName">Nombre de tu app</label><input class="txt" id="dName" maxlength="22" value="${esc(design.name)}" autocomplete="off"></div>
  <fieldset class="field"><legend>Paleta</legend><div class="swatches">${Object.entries(PRESETS).map(([k, p]) => `<button class="swatch" data-action="preset" data-id="${k}" ${pressed(design.preset, k)}><span class="sw-chip" style="--a:${p.light.paper};--b:${p.light.ink};--c:${p.light.accent};--d:${p.dark.paper}"></span>${p.name}</button>`).join('')}</div></fieldset>
  <fieldset class="field"><legend>Color de acento</legend><div class="accent-row">
    <div class="seg"><button data-action="accent-mode" data-mode="preset" ${pressed(design.accentMode, 'preset')}>De la paleta</button><button data-action="accent-mode" data-mode="cover" ${pressed(design.accentMode, 'cover')}>De la portada</button></div>
    <label class="pick" data-on="${design.accentMode === 'custom'}" style="--sw:${esc(design.customAccent)}"><span class="dot"></span>Elegir color<input type="color" id="dAccent" value="${esc(design.customAccent)}" aria-label="Elegir color de acento"></label>
  </div></fieldset>
  <fieldset class="field"><legend>Letra de los títulos</legend><div class="fonts">${Object.entries(FONTS).map(([k, f]) => `<button class="fontopt" data-action="font" data-id="${k}" ${pressed(design.font, k)}><span class="aa" style="font-family:${f.family};font-weight:${f.weight}">Aa</span>${f.name}</button>`).join('')}</div></fieldset>
  <fieldset class="field"><legend>Portada</legend><div class="seg"><button data-action="cover" data-v="square" ${pressed(design.cover, 'square')}>Cuadrada</button><button data-action="cover" data-v="disc" ${pressed(design.cover, 'disc')}>Disco que gira</button></div></fieldset>
  <fieldset class="field"><legend>Modo</legend><div class="seg"><button data-action="mode" data-v="auto" ${pressed(design.mode, 'auto')}>Automático</button><button data-action="mode" data-v="light" ${pressed(design.mode, 'light')}>Claro</button><button data-action="mode" data-v="dark" ${pressed(design.mode, 'dark')}>Oscuro</button></div></fieldset>
  <div class="field"><label class="switch">Sombra de color en el título<input type="checkbox" id="dRiso" ${design.riso ? 'checked' : ''}></label></div>
  <div class="sheet-foot"><button class="btn-line" data-action="design-reset">Restablecer diseño</button><button class="btn-accent" data-action="sheet-close">Listo</button></div>`;
}

function connectSheetHtml() {
  const redirect = Auth.redirectUri();
  const isFile = location.protocol === 'file:';
  const blocked = isFramed || isFile;
  return sheetHead('Conectar Spotify') +
    (isFramed ? `<p class="note" style="margin-top:14px">Esta es la vista previa. La conexión con Spotify funciona al abrir la app desde tu propia dirección web, por ejemplo GitHub Pages o Netlify.</p>` : '') +
    (isFile ? `<p class="note" style="margin-top:14px">Abriste el archivo directo desde tu computadora. Spotify necesita una dirección web: súbelo a GitHub Pages o Netlify, o ábrelo con un servidor local en http://127.0.0.1.</p>` : '') +
    `<ol class="steps">
      <li><p>Entra a <a href="https://developer.spotify.com/dashboard" target="_blank" rel="noopener">developer.spotify.com/dashboard</a> y crea una app. Marca <b>Web API</b> y <b>Web Playback SDK</b>.</p></li>
      <li><p>En <b>Redirect URIs</b> agrega exactamente esta dirección:</p><div class="copy"><code id="redir">${esc(redirect)}</code><button class="btn-line sm" data-action="copy" data-target="redir">Copiar</button></div></li>
      <li><p>En <b>User Management</b> agrega el correo de cada cuenta que vaya a usar la app (hasta 5).</p></li>
      <li><label for="cid" class="lbl">Client ID de tu app</label><input class="txt" id="cid" style="margin-top:8px" value="${esc(Auth.clientId)}" placeholder="32 letras y números" autocomplete="off" spellcheck="false"></li>
    </ol>
    <button class="btn-accent wide" data-action="connect" ${blocked ? 'disabled' : ''}>Conectar con Spotify</button>
    <p class="fine">La cuenta dueña de la app necesita Spotify Premium. La app habla directo con Spotify y guarda tu sesión solo en este navegador.</p>`;
}

async function openDevices(noneMsg) {
  openSheet('devices', sheetHead('Dónde suena') + `<p class="sh-lead">Buscando dispositivos…</p>`);
  const list = await fetchDevices();
  if (sheetKind !== 'devices') return;
  const P = S.player;
  const items = list.map(d => `<button class="dev${(d.active || P.device?.id === d.id) ? ' active' : ''}" data-action="transfer" data-id="${esc(d.id)}" ${d.restricted ? 'disabled' : ''}>${icon(devIcon(d.type), 22)}<span class="grow">${esc(d.name)}${d.id === S.sdk.deviceId ? '<small>Este navegador</small>' : ''}${(d.active || P.device?.id === d.id) ? '<small>Sonando aquí</small>' : ''}</span>${(d.active || P.device?.id === d.id) ? icon('check', 20) : ''}</button>`).join('');
  sheet.innerHTML = sheetHead('Dónde suena') +
    (list.length ? `<p class="sh-lead">${noneMsg === true ? 'Elige un dispositivo para empezar a escuchar.' : 'Elige en qué dispositivo quieres escuchar.'}</p><div class="devs">${items}</div>`
      : `<p class="sh-lead">No hay ningún dispositivo con Spotify abierto. Abre la app de Spotify en tu teléfono, computadora o bocina y toca Actualizar.</p>`) +
    `<div class="sheet-foot"><button class="btn-line" data-action="devices-refresh">Actualizar</button><button class="btn-accent" data-action="sheet-close">Listo</button></div>` +
    (S.mode === 'live' && isMobile ? `<p class="fine">En el teléfono, la música suena en la app de Spotify y esta app la controla.</p>` : '');
}

function accountSheetHtml() {
  if (S.mode !== 'live') return connectSheetHtml();
  return sheetHead('Tu cuenta') + `<div class="acct">${S.me?.image ? `<img src="${esc(S.me.image)}" alt="">` : '<span class="ph"></span>'}<div><p style="font-weight:700;font-size:1.1rem">${esc(S.me?.name || 'Cuenta de Spotify')}</p><p class="muted">Conectada a Spotify</p></div></div>
    <div class="sheet-foot"><button class="btn-line" data-action="logout">Cerrar sesión</button><button class="btn-accent" data-action="sheet-close">Listo</button></div>`;
}

/* ================= TOAST ================= */
let toastT;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 4200); }

/* ================= NAVEGACIÓN ================= */
function openNP() { npEl.classList.add('open'); document.body.classList.add('np-open'); }
function closeNP() { npEl.classList.remove('open'); document.body.classList.remove('np-open'); }
function go(view) { S.view = view; S.stack = []; closeNP(); render(); window.scrollTo(0, 0); }
function openDetail(type, id) { if (!id) return; S.stack.push({ type, id }); render(); window.scrollTo(0, 0); }
function back() { S.stack.pop(); render(); }

/* ================= EVENTOS ================= */
function onClick(e) {
  const el = e.target.closest('[data-action]'); if (!el || el.disabled) return;
  const a = el.dataset.action;
  if (e.target === sheetBg) return;
  switch (a) {
    case 'nav': go(el.dataset.view); break;
    case 'play-track': Player.playFrom(S.lists[el.dataset.list], +el.dataset.index); break;
    case 'open': openDetail(el.dataset.type, el.dataset.id); break;
    case 'open-np': closeNP(); openDetail(el.dataset.type, el.dataset.id); break;
    case 'back': back(); break;
    case 'retry': S.cache = {}; render(); break;
    case 'play-context': if (S.detail) { if (S.detail.type === 'artist' && S.mode === 'live') livePlay({ context_uri: S.detail.uri }, null); else Player.playContext(S.detail); } break;
    case 'save': Player.save(el.dataset.uri, el.dataset.label); break;
    case 'save-current': if (S.player.item) Player.save(S.player.item.uri, S.player.item.type === 'episode' ? 'Episodio' : 'Canción'); break;
    case 'toggle': Player.toggle(); break;
    case 'next': Player.next(); break;
    case 'prev': Player.prev(); break;
    case 'shuffle': Player.shuffle(); break;
    case 'repeat': Player.repeat(); break;
    case 'np-open': openNP(); break;
    case 'np-close': closeNP(); break;
    case 'devices': openDevices(); break;
    case 'devices-refresh': openDevices(); break;
    case 'transfer': Player.transfer(el.dataset.id); break;
    case 'lib-tab': S.libTab = el.dataset.tab; render(); break;
    case 'suggest': { S.search.q = el.dataset.q; const qi = $('#q'); if (qi) qi.value = S.search.q; runSearch(); break; }
    case 'more-results': moreResults(); break;
    case 'design': openSheet('design', designSheetHtml()); break;
    case 'open-connect': openSheet('connect', connectSheetHtml()); break;
    case 'account': openSheet('account', accountSheetHtml()); break;
    case 'sheet-close': closeSheet(); break;
    case 'copy': copyText($('#' + el.dataset.target)?.textContent || '', el); break;
    case 'connect': connect(); break;
    case 'logout': Auth.logout(); closeSheet(); startDemo(); render(); toast('Cerraste sesión. Estás viendo música de ejemplo.'); break;
    case 'preset': design.preset = el.dataset.id; designChanged(); break;
    case 'accent-mode': design.accentMode = el.dataset.mode; if (design.accentMode === 'cover') { coverAccent = null; onTrackChange(); } designChanged(); break;
    case 'font': design.font = el.dataset.id; designChanged(); break;
    case 'cover': design.cover = el.dataset.v; designChanged(); break;
    case 'mode': design.mode = el.dataset.v; designChanged(); break;
    case 'design-reset': design = Object.assign({}, DEFAULT_DESIGN); coverAccent = null; designChanged(); break;
  }
}
function designChanged(keepSheet) {
  saveDesign(); applyDesign(); renderPlayer(true);
  if (sheetKind === 'design' && !keepSheet) { const st = sheet.scrollTop; sheet.innerHTML = designSheetHtml(); sheet.scrollTop = st; }
}
async function moreResults() {
  const s = S.search; s.offset += 10;
  try { const r = await D().search(s.q.trim(), s.offset); s.res.tracks = s.res.tracks.concat(r.tracks); s.res.more = r.more; } catch (e) { toast(errMsg(e)); }
  renderResults();
}
function copyText(text, btn) {
  const done = () => { const o = btn.textContent; btn.textContent = 'Copiado'; setTimeout(() => { btn.textContent = o; }, 1600); };
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(done).catch(() => selectFallback());
  else selectFallback();
  function selectFallback() { const el = $('#redir'); if (!el) return; const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Dirección seleccionada. Cópiala con tu teclado.'); }
}
function connect() {
  const v = ($('#cid')?.value || '').trim();
  if (!/^[a-f0-9]{32}$/i.test(v)) { toast('El Client ID tiene 32 letras y números. Cópialo de la página de tu app en Spotify.'); $('#cid')?.focus(); return; }
  if (v === CONFIG.clientId) store.del('clientId'); else store.set('clientId', v);
  Auth.login();
}

function onInput(e) {
  const t = e.target;
  if (t.id === 'q') { S.search.q = t.value; runSearch(); }
  else if (t.id === 'seek') { seekDragging = true; const P = S.player; t.style.setProperty('--pct', (t.value / Math.max(1, P.durationMs) * 100) + '%'); const tc = $('#tCur'); if (tc) tc.textContent = fmt(+t.value); }
  else if (t.id === 'vol') { volDragging = true; t.style.setProperty('--pct', t.value + '%'); S.player.volume = +t.value; Player.setVolume(+t.value); }
  else if (t.id === 'dName') { design.name = t.value.slice(0, 22); saveDesign(); applyDesign(); }
  else if (t.id === 'dAccent') { design.customAccent = t.value; design.accentMode = 'custom'; saveDesign(); applyDesign(); const pk = t.closest('.pick'); if (pk) { pk.style.setProperty('--sw', t.value); } }
}
function onChange(e) {
  const t = e.target;
  if (t.id === 'seek') { seekDragging = false; Player.seek(+t.value); }
  else if (t.id === 'vol') { volDragging = false; }
  else if (t.id === 'dRiso') { design.riso = t.checked; designChanged(true); }
  else if (t.id === 'dAccent') { designChanged(); }
}

function bind() {
  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  document.addEventListener('change', onChange);
  document.addEventListener('submit', e => { if (e.target.id === 'searchForm') { e.preventDefault(); $('#q')?.blur(); } });
  sheetBg.addEventListener('click', e => { if (e.target === sheetBg) closeSheet(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (sheetKind) closeSheet(); else if (npEl.classList.contains('open')) closeNP(); }
    if (e.key === ' ' && !sheetKind && !e.target.closest('input,textarea,button,a,select')) { e.preventDefault(); Player.toggle(); }
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) syncPlayer(); });
}

/* ================= ARRANQUE ================= */
function startDemo() {
  S.mode = 'demo'; S.me = null; S.cache = {}; S.authError = null; S.search.res = null;
  clearInterval(pollTimer);
  const al = DemoData.albums[0]; const list = DemoData.tracks.filter(t => t.album.id === al.id);
  S.player = Object.assign(S.player, { device: DEMO_DEVICES[0], shuffle: false, repeat: 'off', volume: 70 });
  demoLoad(list, 0, false); S.player.progressMs = 72000;
}
async function startLive() {
  S.mode = 'live'; S.cache = {}; S.search.res = null;
  Object.assign(S.player, { item: null, isPlaying: false, progressMs: 0, durationMs: 0, device: null }); S.queue = [];
  try {
    const me = await sp('/me');
    S.me = { id: me.id, name: me.display_name || me.id, image: pickImg(me.images, 64) }; S.authError = null;
  } catch (e) {
    if (e.code === 'no_auth') return;
    if (e.status === 403) S.authError = 'Spotify no autorizó esta cuenta en tu app. Agrega su correo en User Management del panel de desarrollador.';
    else S.authError = errMsg(e);
  }
  if (S.mode !== 'live') return;
  syncPlayer();
  clearInterval(pollTimer);
  pollTimer = setInterval(() => { if (!document.hidden) syncPlayer(); }, 4000);
  loadSDK();
}

async function init() {
  applyDesign(); bind();
  let fresh = false;
  try { fresh = await Auth.handleCallback(); } catch (e) { toast(errMsg(e)); }
  if (Auth.tokens() && Auth.clientId) { await startLive(); if (fresh && S.me) toast('Listo, ' + S.me.name.split(' ')[0] + '. Tu música está conectada.'); }
  else startDemo();
  render(); renderPlayer(true);
  setInterval(tick, 500);
}
init();
})();
</script>

</html>
